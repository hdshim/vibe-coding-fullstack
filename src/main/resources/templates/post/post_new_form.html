<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 글 작성 - 바이브코딩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Samsung+Sans:wght@300;400;700&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Samsung Sans', sans-serif;
            background-color: #fcfcfc;
        }

        .premium-input {
            transition: all 0.2s ease;
            border: 1px solid #e5e7eb;
        }

        .premium-input:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
            outline: none;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .samsung-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>

<body class="text-gray-900 antialiased">

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-tight text-gray-900">VIBE<span
                            class="text-blue-600">APP</span></a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">새 게시글 작성</h1>
            <p class="mt-2 text-gray-500">당신의 생각을 바이브코딩에 공유해 보세요.</p>
        </div>

        <div class="samsung-card p-8 md:p-10">
            <form id="postForm" th:action="@{/posts/add}" th:object="${postCreateDto}" method="POST">
                <div class="space-y-6">
                    <!-- Title Input -->
                    <div>
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">제목</label>
                        <input type="text" id="title" th:field="*{title}"
                            class="w-full px-4 py-3 rounded-xl premium-input text-gray-900 placeholder-gray-400"
                            placeholder="제목을 입력하세요">
                        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"
                            class="mt-2 text-sm text-red-600 font-medium"></p>
                    </div>

                    <!-- Content Input -->
                    <div>
                        <label for="content" class="block text-sm font-semibold text-gray-700 mb-2">내용</label>
                        <textarea id="content" th:field="*{content}" rows="10"
                            class="w-full px-4 py-3 rounded-xl premium-input text-gray-900 placeholder-gray-400 resize-none"
                            placeholder="내용을 입력하세요"></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div
                        class="flex flex-col sm:flex-row-reverse sm:space-x-reverse sm:space-x-4 space-y-3 sm:space-y-0 pt-6">
                        <button type="submit"
                            class="w-full sm:w-auto px-10 py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200">
                            등록하기
                        </button>
                        <a href="/posts"
                            class="w-full sm:w-auto px-10 py-3.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 text-center transition-all duration-200">
                            취소
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer class="mt-20 py-8 border-t border-gray-100 text-center">
        <p class="text-sm text-gray-400">© 2026 VIBEAPP. Samsung Style Premium Experience.</p>
    </footer>

</body>

</html>
