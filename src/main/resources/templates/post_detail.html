<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - 바이브코딩'">게시글 상세 - 바이브코딩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Samsung+Sans:wght@300;400;700&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Samsung Sans', sans-serif;
            background-color: #f8f9fa;
        }

        .premium-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -3px rgba(0, 0, 0, 0.02);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="text-gray-900 antialiased">

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-tight text-gray-900">VIBE<span
                            class="text-blue-600">APP</span></a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="/"
                            class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors">Home</a>
                        <a href="/posts"
                            class="text-blue-600 border-b-2 border-blue-600 px-3 py-2 text-sm font-medium">Notice</a>
                        <a href="#"
                            class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors">Support</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Header Section -->
        <div class="mb-8">
            <nav class="flex mb-4 text-sm text-gray-500" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-3">
                    <li class="inline-flex items-center">
                        <a href="/posts" class="hover:text-blue-600">게시판</a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd"
                                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                                    clip-rule="evenodd"></path>
                            </svg>
                            <span class="ml-1 md:ml-2 font-medium text-gray-700">상세 보기</span>
                        </div>
                    </li>
                </ol>
            </nav>

            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 tracking-tight mb-4" th:text="${post.title}">
                게시글 제목</h1>

            <div class="flex flex-wrap items-center text-sm text-gray-500 space-x-6 border-b border-gray-100 pb-6">
                <div class="flex items-center">
                    <span class="font-semibold text-gray-700 mr-2">번호:</span>
                    <span th:text="${post.no}">1</span>
                </div>
                <div class="flex items-center">
                    <span class="font-semibold text-gray-700 mr-2">등록일:</span>
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">2023.10.01</span>
                </div>
                <div class="flex items-center">
                    <span class="font-semibold text-gray-700 mr-2">조회수:</span>
                    <span th:text="${post.views}">0</span>
                </div>
            </div>
        </div>

        <!-- Content Section -->
        <article class="bg-white premium-shadow rounded-2xl p-8 md:p-12 mb-10 min-h-[400px]">
            <div class="prose prose-blue max-w-none text-gray-800 leading-relaxed text-lg" th:text="${post.content}">
                게시글 내용이 여기에 표시됩니다.
            </div>
        </article>

        <!-- Footer Action -->
        <div class="flex justify-between items-center bg-gray-50 rounded-2xl p-6">
            <div class="flex space-x-4">
                <a href="/posts"
                    class="inline-flex items-center px-6 py-3 border border-gray-300 shadow-sm text-base font-medium rounded-xl text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200">
                    <svg class="mr-2 -ml-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    목록으로
                </a>
                <a th:href="@{/posts/{no}/edit(no=${post.no})}"
                    class="inline-flex items-center px-6 py-3 border border-transparent shadow-sm text-base font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200">
                    <svg class="mr-2 -ml-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                        </path>
                    </svg>
                    수정하기
                </a>
                <a th:href="@{/posts/{no}/delete(no=${post.no})}" onclick="return confirm('정말 삭제하시겠습니까?')"
                    class="inline-flex items-center px-6 py-3 border border-red-200 shadow-sm text-base font-medium rounded-xl text-red-600 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-200">
                    <svg class="mr-2 -ml-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                        </path>
                    </svg>
                    삭제하기
                </a>
            </div>
            <div class="text-xs text-gray-400">
                최종 수정: <span th:text="${#temporals.format(post.updatedAt, 'yyyy.MM.dd HH:mm')}">2023.10.01</span>
            </div>
        </div>
    </main>

    <footer class="bg-gray-100 py-12 mt-20 border-t border-gray-200">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">© 2026 VIBEAPP. All rights reserved. 삼성 갤럭시 스타일 프리미엄 커뮤니티.</p>
        </div>
    </footer>

</body>

</html>
