<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정 - 바이브코딩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Samsung+Sans:wght@300;400;700&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Samsung Sans', sans-serif;
            background-color: #f8f9fa;
        }

        .premium-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -3px rgba(0, 0, 0, 0.02);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .input-focus:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>

<body class="text-gray-900 antialiased">

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-tight text-gray-900">VIBE<span
                            class="text-blue-600">APP</span></a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="/"
                            class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors">Home</a>
                        <a href="/posts"
                            class="text-blue-600 border-b-2 border-blue-600 px-3 py-2 text-sm font-medium">Notice</a>
                        <a href="#"
                            class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors">Support</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-8">
            <nav class="flex mb-4 text-sm text-gray-500" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-3">
                    <li class="inline-flex items-center">
                        <a href="/posts" class="hover:text-blue-600">게시판</a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd"
                                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                                    clip-rule="evenodd"></path>
                            </svg>
                            <span class="ml-1 md:ml-2 font-medium text-gray-700">게시글 수정</span>
                        </div>
                    </li>
                </ol>
            </nav>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">게시글 수정</h1>
            <p class="mt-2 text-sm text-gray-500">게시글의 정보를 수정할 수 있습니다.</p>
        </div>

        <div class="bg-white premium-shadow rounded-2xl overflow-hidden">
            <div class="p-8 md:p-10">
                <form id="editForm" class="space-y-6" th:action="@{/posts/{no}/save(no=${post.no})}" method="post">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- 번호 (Read-only) -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">번호</label>
                            <input type="text" th:value="${post.no}" readonly
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed">
                        </div>
                        <!-- 조회수 (Read-only) -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">조회수</label>
                            <input type="text" th:value="${post.views}" readonly
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- 생성일 (Read-only) -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">생성일</label>
                            <input type="text" th:value="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}" readonly
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed">
                        </div>
                        <!-- 수정일 (Read-only) -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">수정일</label>
                            <input type="text"
                                th:value="${post.updatedAt != null ? #temporals.format(post.updatedAt, 'yyyy-MM-dd') : ''}"
                                readonly
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed">
                        </div>
                    </div>

                    <!-- 제목 -->
                    <div>
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">제목</label>
                        <input type="text" id="title" name="title" th:value="${post.title}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus transition-all duration-200"
                            placeholder="제목을 입력하세요">
                    </div>

                    <!-- 내용 -->
                    <div>
                        <label for="content" class="block text-sm font-semibold text-gray-700 mb-2">내용</label>
                        <textarea id="content" name="content" rows="10"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus transition-all duration-200"
                            placeholder="내용을 입력하세요" th:text="${post.content}"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div
                        class="flex flex-col sm:flex-row justify-end space-y-3 sm:space-y-0 sm:space-x-4 pt-6 border-t border-gray-100">
                        <button type="button" th:onclick="|location.href='/posts/' + ${post.no}|"
                            class="inline-flex justify-center items-center px-8 py-3 border border-gray-300 shadow-sm text-base font-semibold rounded-xl text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 transition-all duration-200">
                            취소
                        </button>
                        <button type="submit"
                            class="inline-flex justify-center items-center px-8 py-3 border border-transparent text-base font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200">
                            저장
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-gray-100 py-12 mt-20 border-t border-gray-200">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">© 2026 VIBEAPP. All rights reserved. 삼성 갤럭시 스타일 프리미엄 커뮤니티.</p>
        </div>
    </footer>

</body>

</html>
