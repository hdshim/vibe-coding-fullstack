<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vibe Coding - Post List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "samsung-blue": "#034ea2",
                        "samsung-gray": "#f4f4f4",
                        "samsung-border": "#eeeeee",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-white text-black font-sans antialiased;
            }
        }
        .samsung-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
        }
    </style>
</head>

<body class="selection:bg-samsung-blue/10">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <header
            class="sticky top-0 z-50 flex items-center justify-between px-5 h-14 samsung-nav border-b border-samsung-border">
            <div class="flex items-center gap-4">
                <a href="/"><span class="material-symbols-outlined text-black font-light">arrow_back</span></a>
                <h1 class="text-[17px] font-bold tracking-tight">게시글 목록</h1>
            </div>
            <!-- Search and Action -->
            <div class="flex items-center space-x-4">
                <button class="p-2 text-gray-400 hover:text-black transition-colors rounded-full hover:bg-gray-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
                <button class="p-2 text-gray-400 hover:text-black transition-colors rounded-full hover:bg-gray-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="flex-1 px-6 py-10 max-w-4xl mx-auto w-full">
            <div class="mb-10">
                <h2 class="text-[32px] font-bold mb-2">Notice</h2>
                <p class="text-[15px] text-zinc-500">최신 기술 트렌드와 바이브코딩의 소식을 확인하세요.</p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="border-b-2 border-black">
                            <th class="py-4 text-left text-[13px] font-bold w-12">No</th>
                            <th class="py-4 text-left text-[13px] font-bold">Title</th>
                            <th class="py-4 text-left text-[13px] font-bold w-28">Date</th>
                            <th class="py-4 text-right text-[13px] font-bold w-20">Views</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="post : ${posts}"
                            class="border-b border-samsung-border hover:bg-samsung-gray transition-colors group">
                            <td class="py-5 text-[14px]" th:text="${post.no}">1</td>
                            <td class="py-5">
                                <a th:href="@{/posts/{no}(no=${post.no})}"
                                    class="text-[15px] font-medium group-hover:text-samsung-blue transition-colors"
                                    th:text="${post.title}">Title</a>
                            </td>
                            <td class="py-5 text-[13px] text-zinc-500"
                                th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2024.01.01</td>
                            <td class="py-5 text-right text-[13px] text-zinc-500" th:text="${post.views}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-12 flex justify-center">
                <a href="/posts/new"
                    class="bg-black text-white text-[13px] font-bold py-3 px-10 rounded-full hover:bg-zinc-800 transition-colors inline-block text-center">
                    새글
                </a>
            </div>
        </main>

        <footer class="px-6 py-12 bg-samsung-gray border-t border-samsung-border mt-20">
            <p class="text-[12px] text-zinc-400 text-center">Copyright © 2024 Vibe Coding. All rights reserved.</p>
        </footer>
    </div>
</body>

</html>
